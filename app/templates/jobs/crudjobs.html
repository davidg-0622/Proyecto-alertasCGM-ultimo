{% extends 'base.html' %}

{% block content %} 
<body class="p-5">
    <div class="card mx-auto shadow" style="max-width: 500px;">
        <div class="card-header bg-dark text-white text-center fw-bold">
            iSeries Nacional - Automatización
        </div>
        <div class="card-body">
            <!-- Sección de Login -->
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Usuario AS400</label>
                    <input type="text" id="user" class="form-control" placeholder="USUARIO">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Contraseña</label>
                    <input type="password" id="pass" class="form-control" placeholder="••••••••">
                </div>
            </div>

            <hr>
            <h6 class="text-primary fw-bold">Configuración de Instancias</h6>

            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label small fw-bold"># Instancia (Servidor)</label>
                    <input type="text" id="instancia" class="form-control" placeholder="01">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Cant. Instancias</label>
                    <input type="number" id="cantidad" class="form-control" placeholder="017">
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold"># Instancia Inicial</label>
                    <input type="number" id="Instancia_Inicial" class="form-control" placeholder="001">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold"># Instancia Final</label>
                    <input type="number" id="Instancia_Final" class="form-control" placeholder="017">
                </div>

                <div class="col-12">
    <label class="form-label small fw-bold">Equipo/Maquina</label>
    <select id="equipo" class="form-select"> <!-- ID corregido -->
        <option value="MED">MED</option>
        <option value="NAL">NAL</option>
    </select>
</div>
<div class="col-12">
    <label class="form-label small fw-bold">SubSistema</label>
    <input type="text" id="subsistema_val" class="form-control" placeholder="QFNC1"> <!-- ID único -->
</div>
                <div class="col-12">
                    <label class="form-label small fw-bold">Proceso (Instancia)</label>
                    <input type="text" id="proceso" class="form-control" placeholder="RPCCO">
                </div>
                <div class="col-12">
                    <label class="form-label small fw-bold">Descripción</label>
                    <input type="text" id="descripcion" class="form-control" maxlength="30" placeholder="Descripción del job">
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button onclick="ejecutarCreacion()" class="btn btn-primary fw-bold flex-fill">Crear</button>
                <button onclick="eliminar()" class="btn btn-danger fw-bold flex-fill">Eliminar</button>
                <button onclick="editar()" class="btn btn-warning fw-bold flex-fill">Modificar</button>
            </div>

            <div id="resultado" class="mt-3 small text-center fw-bold"></div>
        </div>
    </div>

    <script>
    async function ejecutarCreacion() {
        const resDiv = document.getElementById('resultado');
        
        // Obtenemos los valores asegurando que los IDs coincidan con el HTML de arriba
        const payload = {
            user: document.getElementById('user').value,
            password: document.getElementById('pass').value,
            instancia_servidor: document.getElementById('instancia').value,
            instancia_inicial: document.getElementById('Instancia_Inicial').value,
            instancia_final: document.getElementById('Instancia_Final').value,
            equipo: document.getElementById('equipo').value,
            subsistema: document.getElementById('subsistema_val').value, // ID único
            proceso: document.getElementById('proceso').value,
            descripcion: document.getElementById('descripcion').value
        };

        if (!payload.user || !payload.password) {
            alert("Usuario y contraseña requeridos");
            return;
        }

        resDiv.innerText = "Conectando con AS400...";
        resDiv.className = "mt-3 small text-center text-warning";
        
        try {
            const response = await fetch('/jobs/test-pasos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            resDiv.innerText = data.message;
            resDiv.className = data.ok ? "mt-3 small text-center text-success" : "mt-3 small text-center text-danger";
        } catch (e) {
            resDiv.innerText = "Error de conexión con el servidor Flask";
            resDiv.className = "mt-3 small text-center text-danger";
        }
    }
    </script>
</body>
{% endblock %}
