{% extends 'base.html' %}
{% block content %}

<div class="watermark-container">
    <img src="{{ url_for('static', filename='images/fondo.png') }}" alt="Imagen principal">
</div>


<div class="container mt-5">
    <!-- Centrado vertical y horizontal -->
    <div class="row justify-content-center vh-100 align-items-center">
        <div class="col-lg-5 col-md-7 col-sm-10"> <!-- Mejor control de ancho de columna -->
            <div class="card shadow-lg"> <!-- Añadir sombra para profundidad -->
                <div class="card-header bg-dark text-white"> <!-- Estilo de encabezado -->
                    <h1 class="text-center">{% block title %} Iniciar sesión {% endblock %}</h1>
                </div>
                <div class="card-body">
                    <!-- Añadir clase needs-validation y novalidate para validación visual -->
                    <form action="" method="post" class="needs-validation" novalidate>
                        
                        <div class="mb-3"> <!-- Usar mb-3 para espaciado -->
                            <label for="username" class="form-label">Nombre de usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                            <div class="invalid-feedback">
                                Por favor ingrese su nombre de usuario.
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <!-- Input group para añadir el botón de mostrar/ocultar -->
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye"></i> <!-- Icono de ojo de Bootstrap Icons -->
                                </button>
                                <div class="invalid-feedback">
                                    Por favor ingrese su contraseña.
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4"> <!-- d-grid para que el botón ocupe todo el ancho -->
                            <button type="submit" class="btn btn-secondary btn-lg">Iniciar sesión</button>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- El contenedor de la marca de agua -->
<div class="watermark-container"></div>

<!-- Script para la validación visual de Bootstrap -->
<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

<!-- Script para mostrar/ocultar contraseña -->
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    togglePassword.addEventListener('click', function (e) {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.querySelector('i').classList.toggle('bi-eye');
        this.querySelector('i').classList.toggle('bi-eye-slash');
    });
</script>




{% endblock %}
