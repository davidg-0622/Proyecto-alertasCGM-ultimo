{% extends 'base.html' %}

{% block title %}Editar Servicio{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <!-- Cabecera con degradado y negrilla -->
        <div class="card-header bg-warning bg-gradient py-3 px-4 border-0">
            <div class="d-flex align-items-center">
                <div class="bg-dark bg-opacity-10 rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                    <i class="bi bi-pencil-square text-dark fs-4"></i>
                </div>
                <div>
                    <h4 class="mb-0 text-dark fw-bold" style="letter-spacing: -0.5px;">Editar Servicio</h4>
                    <small class="text-dark opacity-75 fw-semibold">ID: {{ servicio.codigo_de_aplicacion }}</small>
                </div>
            </div>
        </div>

        <div class="card-body p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Código de Aplicación</label>
                    <input type="text" class="form-control" name="codigo_de_aplicacion"
                        value="{{ servicio.codigo_de_aplicacion }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Servicio</label>
                    <input type="text" class="form-control" name="servicio"
                        value="{{ servicio.servicio }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción del Servicio</label>
                    <textarea 
                        class="form-control" 
                        name="descripcion_del_servicio" 
                        rows="4" 
                        placeholder="Escriba aquí la descripción detallada..."
                        required>{{ servicio.descripcion_del_servicio }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Promesa del Servicio</label>
                    <input type="text" class="form-control" name="promesa_del_servicio"
                        value="{{ servicio.promesa_del_servicio }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">SRE</label>
                    <input type="text" class="form-control" name="sre"
                        value="{{ servicio.sre or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">EVC</label>
                    <input type="text" class="form-control" name="evc"
                        value="{{ servicio.evc or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Contacto del Líder</label>
                    <input type="text" class="form-control" name="contacto_del_lider"
                        value="{{ servicio.contacto_del_lider or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">PO</label>
                    <input type="text" class="form-control" name="po"
                        value="{{ servicio.po or '' }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Elemento de Configuración</label>
                    <input type="text" class="form-control" name="elemento_de_configuracion"
                        value="{{ servicio.elemento_de_configuracion or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Grupo Helix</label>
                    <input type="text" class="form-control" name="grupo_inc_helix" value="{{ servicio.grupo_inc_helix }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Runbook (URL)</label>
                    <input type="text" class="form-control border-info" name="runbook" value="{{ servicio.runbook or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Carpeta Servicios Entregados</label>
                    <input type="text" class="form-control" name="carpeta_servicios_entregados"
                        value="{{ servicio.carpeta_servicios_entregados or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Relación de Servicios</label>
                    <input type="text" class="form-control" name="relacion_de_servicios"
                        value="{{ servicio.relacion_de_servicios or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre Grupo Stand By</label>
                    <input type="text" class="form-control" name="nombre_grupo_stand_by"
                        value="{{ servicio.nombre_grupo_stand_by or '' }}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Líder Técnico EVC</label>
                    <input type="text" class="form-control" name="lider_tecnico_evc"
                        value="{{ servicio.lider_tecnico_evc }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Líder Línea/Área Conocimiento</label>
                    <input type="text" class="form-control" name="lider_linea_area_conocimiento"
                        value="{{ servicio.lider_linea_area_conocimiento }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Servicio Especial</label>
                    <input type="text" class="form-control" name="servicio_especial"
                        value="{{ servicio.servicio_especial or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Servicio Clave</label>
                    <input type="text" class="form-control" name="servicio_clave"
                        value="{{ servicio.servicio_clave or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Encargado CGM</label>
                    <input type="text" class="form-control" name="encargado_cgm"
                        value="{{ servicio.encargado_cgm or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Plataforma</label>
                    <input type="text" class="form-control" name="plataforma"
                        value="{{ servicio.plataforma }}" required>
                </div>

                 <div class="mb-3">
                    <label class="form-label fw-bold">Entregado al CGM</label>
                    <input type="text" class="form-control" name="entregado_cgm"
                        value="{{ servicio.entregado_cgm }}" required>
                </div>
                
                <!-- Botones con diseño redondeado -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{{ url_for('app.listar') }}" class="btn btn-secondary rounded-pill px-4">Cancelar</a>
                    <button type="submit" class="btn btn-success rounded-pill px-5 fw-bold shadow">
                        <i class="bi bi-save me-2"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
